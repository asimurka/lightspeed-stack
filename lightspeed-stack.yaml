# @cfg_skills_directory
name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  # Server mode - connects to separate llama-stack service
  use_as_library_client: true
  config:
    profile: run.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
authentication:
  module: "noop"
mcp_servers:
  - name: "datautils"
    url: "http://localhost:3000/mcp"
inference:
  default_provider: openai
  default_model: gpt-4o-mini
skills:
  paths:
    # E2E fixtures: tests/e2e/skills/{echo,summarize}/SKILL.md
    # (docker-compose mounts this tree at /app-root/skills as "skills")
    - tests/e2e/skills
rag:
  byok:
    stores:
      - rag_id: e2e-test-docs
        backend: faiss
        embedding_model: sentence-transformers/all-mpnet-base-v2
        embedding_dimension: 768
        vector_db_id: ${env.FAISS_VECTOR_STORE_ID}
        db_path: ${env.KV_RAG_PATH:=~/.llama/storage/rag/kv_store.db}
        score_multiplier: 1.0
  retrieval:
    # Tool RAG so the LLM must call file_search (inline would inject context silently).
    tool:
      sources:
        - e2e-test-docs
